# Tests et qualité du code : à chaque push et pull request, la suite de
# tests sous les trois Python que uv fournit (3.8, 3.11, 3.14), tout
# avertissement compté comme une erreur, puis ruff. Et, dans un conteneur
# Python 3.7 avec les plus vieux numpy, scipy et matplotlib déclarés — ce
# qu'ont les postes du lycée —, la même suite, sans compter leurs propres
# avertissements de dépréciation : ce dernier travail n'est pas bloquant
# tant qu'il n'a pas été vu vert.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Tests sous Python ${{ matrix.python }}
        run: uv run --python ${{ matrix.python }} pytest -W error

  python37:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: numpy 1.16, scipy 1.3, matplotlib 3.0, pytest 7
        run: pip install "numpy==1.16.*" "scipy==1.3.*" "matplotlib==3.0.*" "pytest==7.4.*"
      - name: Tests sous Python 3.7
        # numpy 1.16 avertit (RuntimeWarning « ufunc size changed ») à l'import de
        # scipy 1.3 ; transformé en erreur par filterwarnings, il laissait scipy.linalg
        # à moitié importé.
        run: python -m pytest -W "ignore::DeprecationWarning" -W "ignore::PendingDeprecationWarning" -W "ignore::RuntimeWarning"

  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: ruff check
        run: uvx ruff@0.17.0 check .
      - name: ruff format
        run: uvx ruff@0.17.0 format --check .
